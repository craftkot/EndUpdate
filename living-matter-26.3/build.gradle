plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { livingmatter { sourceSet(sourceSets.main) } }
}
tasks.register("generateModMetadata", ProcessResources) {
    def props = [minecraft_version_range:minecraft_version_range,neo_version:neo_version,mod_id:mod_id,mod_name:mod_name,mod_license:mod_license,mod_version:mod_version]
    inputs.properties(props)
    expand(props)
    from("src/main/templates")
    into("build/generated/sources/modMetadata")
}
sourceSets.main.resources.srcDir(tasks.named("generateModMetadata"))
neoForge.ideSyncTask(tasks.named("generateModMetadata"))
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
