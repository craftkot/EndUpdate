name: Materialize Textures

on:
  push:
    paths:
      - ".github/workflows/materialize-textures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  textures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore PNG textures
        shell: bash
        run: |
          set -euo pipefail
          cat ci_assets/textures.part*.b64 > textures.tar.gz.b64
          echo "7b61f643aa3510eb833ebc1a66114585879589b57ffec4bb1d0cf774945b1215  textures.tar.gz.b64" | sha256sum -c -
          base64 --decode textures.tar.gz.b64 > textures.tar.gz
          echo "0ec52612649e3203f7dd2dc71a8b0015edc5d3f58ff898da1bcc3ee1b7c79232  textures.tar.gz" | sha256sum -c -
          tar -xzf textures.tar.gz
          rm textures.tar.gz textures.tar.gz.b64
      - name: Commit textures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/endupdate/textures
          if git diff --cached --quiet; then
            echo "No texture changes."
            exit 0
          fi
          git commit -m "Restore End Update textures"
          git push
