name: Dedicated Server Smoke Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  server-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat ci_payload_v2/part*.b64 > endupdate-src.b64
          echo "a0fa49b9a54fa291765db858b0539254fcb08e9ce2047f5c053d1de7a3bc993f  endupdate-src.b64" | sha256sum -c -
          base64 --decode endupdate-src.b64 > endupdate-src.tar.gz
          echo "a44fefb894497f1f82d6fc7f1780e2d4f793b327679dbd632c637891099da07d  endupdate-src.tar.gz" | sha256sum -c -
          mkdir -p work
          tar -xzf endupdate-src.tar.gz -C work

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Static resource audit
        working-directory: work
        run: python3 tools/static_audit.py

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Compile first
        working-directory: work
        run: gradle --no-daemon build --stacktrace

      - name: Accept test-server EULA
        run: |
          mkdir -p work/run
          echo 'eula=true' > work/run/eula.txt

      - name: Boot Forge dedicated server
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/server-smoke.log"
          gradle --no-daemon runServer >"$LOG" 2>&1 &
          PID=$!

          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 300); do
            if grep -Eq 'Done \([0-9.]+s\)!' "$LOG"; then
              echo 'Dedicated server reached the ready state.'
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo 'Server exited before reaching the ready state.'
              tail -n 250 "$LOG" || true
              exit 1
            fi
            sleep 1
          done

          echo 'Server did not reach the ready state within 300 seconds.'
          tail -n 250 "$LOG" || true
          exit 1

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedicated-server-smoke-logs
          path: |
            server-smoke.log
            work/run/logs/**
          if-no-files-found: ignore
