name: Package Living Matter Blockbench models
on:
  push:
    branches: [feature/living-matter-26-3]
    paths:
      - 'living-matter-26.3/blockbench/**'
      - '.github/workflows/living-matter-blockbench.yml'
  workflow_dispatch:
jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate visible geometry and embedded VANILLA PNG bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,base64,struct
          folder=Path('living-matter-26.3/blockbench')
          models=sorted(folder.glob('*.bbmodel'))
          assert len(models)==8, f"Expected 8 models, got {len(models)}"
          for path in models:
              model=json.loads(path.read_text(encoding='utf8'))
              assert model['meta']['model_format']=='free'
              cuboids=model['elements']
              assert len(cuboids)>=4, (path,'no cubes')
              refs={e['uuid'] for e in cuboids}
              children=set()
              for group in model['outliner']:
                  children.update(c for c in group.get('children',[]) if isinstance(c,str))
              assert refs==children, (path,'outliner missing geometry')
              for cube in cuboids:
                  assert cube.get('autouv') == 1 and cube.get('box_uv') is False, (path, cube['name'], 'AutoUV disabled')
                  dx,dy,dz=[round(b-a,5) for a,b in zip(cube['from'],cube['to'])]
                  spans={'north':(dx,dy),'south':(dx,dy),'east':(dz,dy),'west':(dz,dy),'up':(dx,dz),'down':(dx,dz)}
                  for direction,face in cube['faces'].items():
                      if direction in spans:
                          assert face['uv']==[0,0,*spans[direction]], (path, cube['name'], direction, face['uv'], 'stretched UV')
                  assert cube['type']=='cube'
                  assert len(cube['rotation'])==3 and len(cube['origin'])==3
                  assert all(a<b for a,b in zip(cube['from'],cube['to']))
                  assert cube.get('visibility', True) is not False
                  for face in cube['faces'].values():
                      assert isinstance(face['texture'],int)
                      assert 0<=face['texture']<len(model['textures'])
              assert len(model['textures'])>=2
              for texture in model['textures']:
                  assert texture.get('wrap_mode')=='repeat', (path, texture['name'], 'tiling disabled')
                  value=texture['source']
                  assert value.startswith('data:image/png;base64,')
                  png=base64.b64decode(value.split(',',1)[1],validate=True)
                  assert png.startswith(b'\x89PNG\r\n\x1a\n')
                  w,h=struct.unpack('>II',png[16:24])
                  assert w>=16 and h>=16
              print(f'PASS: {path.name} ({len(cuboids)} cubes, {len(model["textures"])} embedded vanilla PNG textures)')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LivingMatter_Blockbench_TILED_UV
          path: |
            living-matter-26.3/blockbench/*.bbmodel
            living-matter-26.3/blockbench/README.md
          if-no-files-found: error
