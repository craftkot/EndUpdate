name: Build End Update

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat ci_payload/part*.b64 | base64 --decode > endupdate-src.tar.gz
          mkdir -p work
          tar -xzf endupdate-src.tar.gz -C work
          echo "Source restored:"
          find work -maxdepth 3 -type f | sort | head -100

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Compile Forge mod
        working-directory: work
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: endupdate-forge-1.20.1
          path: work/build/libs/*.jar
          if-no-files-found: error
