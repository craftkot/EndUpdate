name: Build model test JAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-model-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Overlay custom End mob models
        shell: bash
        run: |
          cat > /tmp/model_patch.b64 <<'B64'

B64
          base64 -d /tmp/model_patch.b64 > /tmp/model_patch.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/model_patch.zip') as z:
              z.extractall('.')
          PY

      - name: Build
        run: gradle --no-daemon clean build --stacktrace

      - name: Upload model test JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndUpdate-model-test
          path: build/libs/*.jar
          if-no-files-found: error
