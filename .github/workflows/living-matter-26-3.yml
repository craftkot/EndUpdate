name: Build Living Matter 26.3
on:
  push:
    branches: [feature/living-matter-26-3]
    paths:
      - 'living-matter-26.3/**'
      - '.github/workflows/living-matter-26-3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'living-matter-26.3/**'
      - '.github/workflows/living-matter-26-3.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: living-matter-26.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle --no-daemon build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: living-matter-neoforge-26.3
          path: living-matter-26.3/build/libs/*.jar
          if-no-files-found: error
